name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 完整 git 历史用于 sitemap lastmod
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install python helpers
        # Pillow: 构建前的图片压缩；fonttools/brotli: 字体子集校验
        run: python -m pip install --quiet pillow fonttools brotli

      - name: Build website
        run: yarn build

      - name: Verify serif font coverage
        run: python scripts/serif_chars.py --verify-font

      - name: SEO checks
        run: python scripts/seo_check.py

      # Popular action to deploy to GitHub Pages:
      # Docs: https://github.com/peaceiris/actions-gh-pages#%EF%B8%8F-docusaurus
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Build output to publish to the `gh-pages` branch:
          publish_dir: ./build
          # The following lines assign commit authorship to the official
          # GH-Actions bot for deploys to `gh-pages` branch:
          # https://github.com/actions/checkout/issues/13#issuecomment-724415212
          # The GH actions bot is used by default if you didn't specify the two fields.
          # You can swap them out with your own user credentials.
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

      # 站点由东京 VPS 直接服务：VPS 每 2 分钟从 gh-pages 拉一次
      - name: Wait for Tokyo origin sync
        run: |
          set -euo pipefail
          MAIN_JS=$(basename "$(find build/assets/js -maxdepth 1 -name 'main.*.js' | head -1)")
          page=/tmp/dnevend-home.html

          for i in $(seq 1 20); do
            rm -f "$page"
            if curl -fsS --max-time 15 "https://dnevend.site/?__deploy=${RANDOM}${RANDOM}" -o "$page" \
              && grep -q "$MAIN_JS" "$page"; then
              echo "东京源站已同步：$MAIN_JS"
              exit 0
            fi
            echo "等待东京源站同步… ($i/20)"
            sleep 15
          done

          echo "::error::5 分钟内源站仍是旧版本，检查 VPS 上的 dnevend-sync.timer"
          exit 1

      - name: Submit URLs to IndexNow
        continue-on-error: true
        run: python scripts/indexnow.py

      - name: Submit URLs to Baidu
        continue-on-error: true
        env:
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
        run: |
          if [ -z "$BAIDU_TOKEN" ]; then
            echo "BAIDU_TOKEN 未配置，跳过百度主动推送"
            exit 0
          fi
          python scripts/baidu_push.py
