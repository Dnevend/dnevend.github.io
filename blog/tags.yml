# 博客标签中心定义。
# key 必须与文章 frontMatter 中 `tags:` 的写法完全一致（区分大小写与空格），
# label 是页面上展示的名字，permalink 是 /blog/tags/<permalink> 的稳定地址。
# 好处：标签 URL 不再被 lodash.kebabCase 自动推导（例如 OpenCode → open-code），
# 也让 "Claude Code"、"Telegram BOT" 之类的展示名不被 _.capitalize 改写。
# description 会用于标签页的 meta description 和分享摘要。

